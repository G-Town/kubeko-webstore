schema: spec-driven

# Project context shown to agents when they create OpenSpec artifacts.
context: |
  # Kubeko Webstore

  ## Product intent
  - Kubeko is an independent clothing brand using a custom Shopify Online Store 2.0
    theme in `theme/`. The storefront should feel editorial and image-led, using
    Garamond + Helvetica Now, a white/black/#444 palette, and full-bleed photography.

  ## Engineering priorities
  - Prioritize correctness, maintainability, storefront performance, and a coherent,
    merchant-editable home page, header, and cart.
  - Work is scoped to theme development: home, header and cart dropdown, product
    cards/carousels, PDP, collections, search, CSS, JavaScript, and OpenSpec records.

  ## Technology and hard constraints
  - The theme uses custom Liquid, hand-written browser JavaScript, and CSS; it does
    not follow Dawn conventions and has no committed build system or JS framework.
  - `assets/base.js` uses custom elements. Guard registrations with
    `customElements.get()`, scope selectors to the component instance, and tolerate
    section reloads and partial DOM replacement.
  - Preserve the cart refresh contract: `/?section_id=cart-drawer`.
  - Do not edit minified third-party bundles such as Swiper or PhotoSwipe unless
    explicitly requested.
  - Verify desktop and mobile behavior separately for every UI change.

  ## v1 non-goals
  - Customer accounts (`templates/customers/*`), multi-language or multi-market
    support, a theme build system or JS framework, and Shopify Theme Store submission
    are out of scope unless a change explicitly expands scope.

  ## Architecture watchlist
  - `assets/index.css` is the live CSS source of truth despite being a hand-edited
    Tailwind v3 output. Styles are fragmented between it and inline section/snippet
    styles; the original Tailwind pipeline is not committed.
  - The document shell conditionally loads poorly: several application and Swiper
    assets load globally. Header is fixed and combines cart, mobile navigation, and
    search UI. Search works at a basic level but is incomplete and unspecced; review
    it before extending it.
  - Home uses `templates/index.json`, image-led sections, and a Swiper product
    carousel; its `index-page` section is vestigial. The PDP is a large monolith with
    no schema, duplicate IDs, and multiple product forms.
  - Metafields are defined locally in `.shopify/metafields.json` but are not committed.
    Current Liquid references include known key mismatches; treat mismatches as bugs.
  - The active cart is a header dropdown, while dead cart-drawer code remains in
    `base.js`. The intended long-term direction is a consistent drawer contract.
  - Important missing storefront templates include 404, cart, gift card, blog/article,
    and password.

  ## Legacy modernization policy
  - Existing code is not presumed intentional, necessary, or a model to copy. It may
    be stale, incomplete, or poorly implemented.
  - When evidence supports a materially better result for performance, appearance,
    accessibility, maintainability, or architecture, identify and recommend it.
  - Keep unrelated major rewrites out of an active change: propose them as a separate
    change or explicitly expand the current change before implementation.

rules:
  proposal:
    - One concern per change; keep changes small and independently reviewable.
    - Plan in reviewable stages and pause for user review at scope and design decisions
      before drafting the remaining artifacts.
    - Always include a Non-goals section.
    - Ground design decisions in file-and-line evidence; distinguish observed behavior
      from assumptions.
    - Record relevant legacy or technical-debt findings and state whether each belongs
      in the change or in a follow-up change.
  design:
    - When retaining an existing implementation despite an apparent improvement
      opportunity, explicitly record why it is retained and the trade-off accepted.
  tasks:
    - Break work into small, individually verifiable steps that the user can inspect.
    - Prefer edits grouped by file to limit churn.
    - Include focused verification commands inline and an end-to-end verification
      appropriate to the changed behavior.

operations:
  apply:
    guidance:
      - Implement in small steps and pause for user review between steps.
      - Respect `theme/AGENTS.md`, including custom-element, section-reload, cart, and
        third-party-bundle constraints.
      - Do not fold substantial legacy remediation into an unrelated change without
        explicit scope approval.
  archive:
    guidance:
      - Validate the completed change and synchronize durable specs before archival.
